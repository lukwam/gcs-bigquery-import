[project]
name = "gcs-bigquery-import"
version = "2.0.0"
description = "Load files uploaded to Cloud Storage into BigQuery"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.src]
include = ["main.py", "tests"]
